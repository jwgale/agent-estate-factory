# Dual-layer sacred exclusions. Hardcoded LOCKED_SACRED always applies.
# File overlays are additive. Omitting a locked id does not remove it.
# Apply / convey / cloud-agent assignment refuse on hit.

schema: cell-one.sacred.v0

locked:
  - id: cyera-ci
    aliases: [cyera, cyera_ci]
    reason: Cyera CI must not be an estate agent. Sanctum is not Cyera.
  - id: rust-classroom
    aliases: [rust_classroom]
    reason: Rust classroom stays outside the estate; it is not an agent lane.

overlays:
  - id: lab-notebook
    aliases: [lab_notebook]
    reason: Fixture overlay. Not an estate agent. Additive refuse only.
