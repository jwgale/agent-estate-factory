# Agent pack + orchestrator handoff + pack packages + standing routines fixture.
# Throwaway / test only. Not locked examples/estate.yaml.
# Pack membership scopes handoff. Opt-in mixed select without --pack is
# --select equal-class / agent select: equal-class.
# Packages ≈ skills; routines ≈ automations. Optional schedule + chain.
# dual-specialty seats ag_news and rust_idiom beside frontier_http.
# standing-dual is that package under the runner (@hourly).
# Each hop allow-list names one binding. Two or more eligible ids abstain.
# Security stays existing intentions. Not live Grok Bot sync. Mock does not
# call Ollama. completion_label stays opt-in (CELL_COMPLETE_LABEL / category_codec).

apiVersion: cell-one.estate.v0
version: 0
kind: agent-estate
name: cell-one-agent-pack-handoff
schema: schema/estate.v0.schema.json
default_effect: deny

agents:
  - id: horizon
    display_name: Horizon
    lane: horizon
    desktop: horizon-desktop
    tools: []
    mounts: []
    mcp: []
    models:
      - id: frontier_http
        description: Frontier complete via http-remote (no live call)
      - id: local_slm
        description: Local specialist in-path (A8)
  - id: research
    display_name: Research
    lane: research
    desktop: research-desktop
    tools:
      - id: notes-append
        description: Append a note inside the Research lane
    mounts:
      - id: notes
        path: notes
        description: Research notes directory (own lane only)
    mcp: []
    models:
      - id: ag_news
        description: Purpose specialty seat for pack handoff
  - id: sanctum
    display_name: Sanctum
    lane: sanctum
    desktop: sanctum-desktop
    tools: []
    mounts: []
    mcp: []
    models: []
  - id: idiom
    display_name: Idiom
    lane: idiom
    desktop: idiom-desktop
    tools: []
    mounts: []
    mcp: []
    models:
      - id: rust_idiom
        description: Purpose specialty seat for Rust idiom hops

lanes:
  - id: horizon
    root_path: lanes/horizon
    owner_agent_id: horizon
  - id: research
    root_path: lanes/research
    owner_agent_id: research
  - id: sanctum
    root_path: lanes/sanctum
    owner_agent_id: sanctum
  - id: idiom
    root_path: lanes/idiom
    owner_agent_id: idiom

intentions:
  - subject_agent: research
    object: ag_news
    kind: model
    effect: allow
    note: Pack handoff complete targets the specialty seat
  - subject_agent: horizon
    object: frontier_http
    kind: model
    effect: allow
    note: Multi-hop chain frontier hop after specialty
  - subject_agent: idiom
    object: rust_idiom
    kind: model
    effect: allow
    note: Dual-specialty chain hop on the Rust idiom seat

model_bindings:
  - id: frontier_http
    class: frontier
    driver: http-remote
    params:
      hint: openai-compat
      endpoint_env: CELL_FRONTIER_ENDPOINT
    wired: true
  - id: local_slm
    class: local
    driver: ollama
    params:
      host_class: any
      endpoint_env: CELL_LOCAL_ENDPOINT
      job: policy-precheck
    wired: true
  - id: ag_news
    class: local
    driver: ollama
    params:
      host_class: any
      endpoint_env: CELL_LOCAL_ENDPOINT
      model: specialist-agnews-all
      job: classify
    wired: true
  - id: rust_idiom
    class: local
    driver: ollama
    params:
      host_class: any
      endpoint_env: CELL_LOCAL_ENDPOINT
      model: specialist-rustidiom-all
      job: classify
    wired: true

packs:
  - id: research-crew
    members:
      - horizon
      - research
    orchestrator: horizon
  - id: dual-specialty
    members:
      - horizon
      - research
      - idiom
    orchestrator: horizon

pack_packages:
  - id: classify-ping
    pack: research-crew
    prompt: "ping"
    binding: ag_news
    note: Skill analog on the research pack. Run via estate package run. --chain uses hops.
    chain:
      - agent: research
        binding: ag_news
      - agent: horizon
        binding: frontier_http
  - id: classify-once
    pack: research-crew
    prompt: "ping"
    binding: ag_news
    note: Single-hop skill. --chain refuses (no chain:/steps:).
  - id: dual-specialty
    pack: dual-specialty
    prompt: "ping"
    note: Two purpose seats then frontier. Run with --chain. Mock does not call Ollama.
    chain:
      - agent: research
        binding: ag_news
      - agent: idiom
        binding: rust_idiom
      - agent: horizon
        binding: frontier_http

routines:
  - id: standing-classify
    package: classify-ping
    schedule: "@hourly"
    note: Automation analog. Tick when due; local last_run/next_due. Not Grok Bot sync.
  - id: standing-once
    package: classify-once
    schedule: "@hourly"
    note: Single-hop standing routine for multi-id supervise. Not Grok Bot sync.
  - id: standing-dual
    package: dual-specialty
    schedule: "@hourly"
    note: Dual-specialty chain under the runner. Tick journals three hops + session. Not Grok Bot sync.

enrich_packs:
  curator: jason
  policy: manual
  packs: []

placements:
  - id: cell-one-box
    kind: box
    host_class: any
    agents: [horizon, research, sanctum, idiom]
    wired: true
    note: This machine. Isolation driver is profile-dir today; swappable later.
  - id: cursor-cloud
    kind: cloud-agent
    host_class: any
    agents: []
    wired: false
    note: Declared stub. Floor will not spawn this.

sacred_exclusions:
  - id: cyera-ci
    aliases: [cyera, cyera_ci]
    reason: Cyera CI must not be an estate agent. Sanctum is not Cyera.
  - id: rust-classroom
    aliases: [rust_classroom]
    reason: Rust classroom stays outside the estate; it is not an agent lane.
