# Apple Silicon laptop. Alias apple_silicon → apple-silicon.
# Ollama-on-Mac is Supported. MLX stays a catalog-complete stub.

version: 0
kind: agent-estate
name: cell-one-apple-silicon
schema: schema/estate.v0.schema.json
default_effect: deny

agents:
  - id: horizon
    display_name: Horizon
    lane: horizon
    desktop: horizon-desktop
    tools: []
    mounts: []
    mcp: []
    models:
      - id: xai_grok
        description: Frontier complete under the estate (A7)
      - id: local_slm
        description: Local specialist in-path (A8)
  - id: research
    display_name: Research
    lane: research
    desktop: research-desktop
    tools:
      - id: notes-append
        description: Append a note inside the Research lane
    mounts:
      - id: notes
        path: notes
        description: Research notes directory (own lane only)
    mcp: []
    models:
      - id: local_slm
        description: In-path policy-precheck before notes-append
  - id: sanctum
    display_name: Sanctum
    lane: sanctum
    desktop: sanctum-desktop
    tools: []
    mounts: []
    mcp: []
    models: []

lanes:
  - id: horizon
    root_path: lanes/horizon
    owner_agent_id: horizon
  - id: research
    root_path: lanes/research
    owner_agent_id: research
  - id: sanctum
    root_path: lanes/sanctum
    owner_agent_id: sanctum

intentions: []

model_bindings:
  - id: xai_grok
    class: frontier
    driver: frontier-http
    params:
      hint: xai-grok
      api_key_env: XAI_API_KEY
      api_base_env: XAI_API_BASE
      model_env: XAI_MODEL
    wired: true
  - id: local_slm
    class: local
    driver: ollama
    params:
      host_class: apple_silicon
      endpoint_env: CELL_LOCAL_ENDPOINT
      job: policy-precheck
    wired: true

enrich_packs:
  curator: jason
  policy: manual
  packs: []

placements:
  - id: cell-one-box
    kind: box
    host_class: apple_silicon
    agents: [horizon, research, sanctum]
    wired: true
    note: Apple Silicon. Ollama-on-Mac is Supported. MLX is a stub on the same catalog.
  - id: cursor-cloud
    kind: cloud-agent
    host_class: any
    agents: []
    wired: false
    note: Declared stub. Floor will not spawn this.

sacred_exclusions:
  - id: cyera-ci
    aliases: [cyera, cyera_ci]
    reason: Cyera CI must not be an estate agent. Sanctum is not Cyera.
  - id: rust-classroom
    aliases: [rust_classroom]
    reason: Rust classroom stays outside the estate; it is not an agent lane.
